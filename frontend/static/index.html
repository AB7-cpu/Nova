<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova — Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-grid"></div>

    <div class="container">
        <div class="card">

            <!-- Header -->
            <div class="header">
                <div class="logo">
                    <div class="logo-dot" id="logoDot"></div>
                    <span>Nova</span>
                </div>
                <div class="connection-indicator" id="connIndicator" title="Disconnected">
                    <div class="conn-dot"></div>
                </div>
            </div>

            <!-- Waveform -->
            <div class="waveform-wrapper">
                <div class="waveform-glow" id="waveGlow"></div>
                <div class="bars" id="bars"></div>
            </div>

            <!-- Status pill -->
            <div class="status-pill" id="statusPill">
                <span class="status-icon" id="statusIcon">💤</span>
                <span class="status-text" id="statusText">Sleeping</span>
            </div>

            <!-- Model Mode Selector -->
            <div class="mode-control">
                <div class="mode-label-row">
                    <span class="mode-title">Model Mode</span>
                    <span class="mode-badge" id="modeBadge">Hybrid</span>
                </div>
                <div class="select-container">
                    <select class="mode-dropdown" id="modeSelect" onchange="changeModelMode(this.value)">
                        <option value="hybrid">⚡ Hybrid (Groq → 15s Fallback)</option>
                        <option value="offline">🔒 Offline (100% Local Ollama)</option>
                    </select>
                    <div class="dropdown-chevron">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="mode-hint" id="modeHint">Groq primary with 15s timeout fallback to Ollama</div>
            </div>

            <!-- Control button -->
            <button class="control-btn" id="controlBtn" onclick="toggleSystem()">
                <span id="btnIcon">▶</span>
                <span id="btnText">Start</span>
            </button>

        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
